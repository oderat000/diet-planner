name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Static export can't ship API routes (they need a server), and the Gemini-backed
      # ones live on Vercel instead — see .github/workflows note in README/AGENTS for setup.
      - run: rm -rf src/app/api
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Base URL of the Vercel deployment that serves /api/analyze-dish and /api/ask.
          # Set this as an Actions repo *variable* (not secret — it ends up in the client
          # bundle regardless, it's just a URL). Leave unset to disable the AI add-ons.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
