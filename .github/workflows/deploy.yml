name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs against the complete tree, before anything is deleted for the static export.
  # The Vercel deployment ships src/app/api, so those files must be linted and
  # typechecked here — the Pages build alone would never look at them.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    # Pull requests get the checks above but must not publish to Pages.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `output: export` supports none of: route handlers that read the Request, Server
      # Actions, cookies(), or dynamic routes without generateStaticParams. The API routes
      # and the whole auth system use all four, so they are dropped from the static build
      # and live on Vercel instead. The layout already hides the account UI when
      # GITHUB_PAGES is set, so the remaining pages have nothing pointing at them.
      #
      # Without the auth directories this build fails outright on
      # /verify-email/[token] — a dynamic route with no generateStaticParams.
      - run: rm -rf src/app/api src/app/login src/app/signup src/app/account src/app/admin src/app/verify-email
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Base URL of the Vercel deployment that serves /api/analyze-dish and /api/ask.
          # Set this as an Actions repo *variable* (not secret — it ends up in the client
          # bundle regardless, it's just a URL). Leave unset to disable the AI add-ons.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
